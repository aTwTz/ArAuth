# e2e 专用最小边缘夹具（仅 scripts/e2e.sh 使用，不是生产配置）。
# 复刻生产 nginx+certbot 形态的三件事：TLS 终结、公开 API 白名单、
# 静态伺服。证书由 e2e.sh 在临时目录生成（一次性 CA 签 localhost），
# 挂载在 /etc/nginx/e2e-tls/。

server {
	listen 80 default_server;
	# e2e 客户端只走 https；80 仅保持 HTTP→HTTPS 跳转形态。
	return 308 https://$host$request_uri;
}

server {
	listen 443 ssl default_server;
	server_name _;

	ssl_certificate     /etc/nginx/e2e-tls/server.crt;
	ssl_certificate_key /etc/nginx/e2e-tls/server.key;

	# 公开 API 白名单，与 service-server 路由一一对应；新增公开端点时同步此处。
	# /exchange 不在白名单内，永远不到达公网。
	location ~ ^/(health|pow|register|login|recovery|whoami)(/|$) {
		proxy_pass http://service-server:8081;
		# 单值重写 XFF：RP 信任代理时取末项即客户端地址。
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header Host $host;
	}

	location / {
		root /srv/web;
	}
}
